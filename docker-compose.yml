name: portfolio-payload

# Credentials and port come from .env (POSTGRES_*).
#   Database only (dev with `pnpm dev` on the host):  docker compose up -d
#   Database + app in a container:                     docker compose --profile app up

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  payload:
    profiles: ['app']
    image: node:22.23.4-alpine
    working_dir: /home/node/app
    command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm dev"
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reached by service name, not the host port
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  node_modules:
