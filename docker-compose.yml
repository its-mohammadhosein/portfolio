name: portfolio-payload

# Credentials and port come from .env (POSTGRES_*).
#   Database only (dev with `pnpm dev` on the host):  docker compose up -d
#   Database + production app (Dockerfile, standalone): docker compose --profile app up --build
#     The app uses its own database (DOCKER_POSTGRES_DB, default portfolio_docker) so its migrations
#     never touch the dev database, which `pnpm dev` manages by schema push. Create it once:
#       docker compose up -d && docker compose exec postgres createdb -U payload portfolio_docker
#     The image build prerenders pages, so it reaches the database through the published port
#     (host.docker.internal:${POSTGRES_PORT}).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  payload:
    profiles: ['app']
    build:
      context: .
      args:
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:${POSTGRES_PORT:-5433}/${DOCKER_POSTGRES_DB:-portfolio_docker}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      extra_hosts:
        - 'host.docker.internal:host-gateway'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Inside the compose network the database is reached by service name, not the host port
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${DOCKER_POSTGRES_DB:-portfolio_docker}
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    volumes:
      - media:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  media:
